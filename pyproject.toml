[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "watermark-remover-auto-agent-tool"
version = "0.0.5b0"
description = "Local CPU-focused PDF forensic engine and agent-native surgical actuator"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "watermark-remover-auto-agent-tool contributors" }]
keywords = ["pdf", "watermark", "remover", "agent", "agent-tool", "pikepdf", "verification", "cpu-only"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Printing",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Utilities",
]

dependencies = [
    "pikepdf>=9.0",
    "PyMuPDF>=1.24.0",
    "numpy>=1.24",
    "opencv-python-headless>=4.8",
    "Pillow>=10.0",
    "pydantic>=2.0",
    "scipy>=1.12",
    "scikit-image>=0.22",
    "doxapy>=0.9.4; python_version >= '3.12'",
    "fonttools>=4.67.0",
    "sknw>=0.15",
    "skan>=0.13.1",
    "psutil>=5.9.0",
    "mcp>=1.0.0",
    "deskew>=1.6.0",
    "page-dewarp>=0.3.4",
]

[project.optional-dependencies]
ml = ["onnxruntime>=1.16"]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "ruff>=0.1.0",
    "mypy>=1.6.0",
]

[project.scripts]
wmclean = "wmclean.cli:main"
wmclean-mcp = "wmclean.mcp_server:main"

[tool.setuptools.packages.find]
include = ["wmclean*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --tb=line --no-header"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
ignore_missing_imports = true
warn_unused_ignores = true
show_error_codes = true
disable_error_code = ["operator", "misc", "var-annotated"]

[dependency-groups]
dev = [
    "scipy-stubs>=1.17.1.5",
]
