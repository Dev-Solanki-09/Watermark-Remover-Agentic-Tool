[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "watermark-remover-auto-agent-tool"
version = "1.0.0"
description = "CPU-only PDF watermark removal tool with deterministic verification and agent-friendly operational contracts"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "watermark-remover-auto-agent-tool contributors" }]
keywords = ["pdf", "watermark", "remover", "agent", "agent-tool", "pikepdf", "verification", "cpu-only"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Printing",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Utilities",
]

dependencies = [
    "pikepdf>=8.0",
    "PyMuPDF>=1.23",
    "numpy>=1.24",
    "opencv-python-headless>=4.8",
    "Pillow>=10.0",
    "pydantic>=2.0",
]

[project.optional-dependencies]
ml = ["onnxruntime>=1.16"]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "ruff>=0.1.0",
    "mypy>=1.6.0",
]

[project.scripts]
wmclean = "wmclean.cli:main"

[tool.setuptools.packages.find]
include = ["wmclean*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --tb=line --no-header"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
ignore_missing_imports = true
warn_unused_ignores = true
show_error_codes = true
disable_error_code = ["operator", "misc", "var-annotated"]
